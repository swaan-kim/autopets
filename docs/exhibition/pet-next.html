<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AutoPets · 펫의 다음 모습</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #08080b;
      color: #f5f3f7;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      display: flex;
      flex-direction: column;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 8%, #211c2870, transparent 60%),
        #08080b;
    }
    body:not([data-embedded]) { min-height: 100svh; }
    .masthead {
      width: min(1280px, calc(100% - 80px));
      margin: 0 auto;
      padding: 26px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .wordmark {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.055em;
    }
    .wordmark span, h1 span { color: #cbe59e; }
    .fullscreen {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #35313d;
      border-radius: 999px;
      padding: 0 14px;
      background: #17151c;
      color: #e0dce6;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .fullscreen:hover { background: #25212c; color: #fff; }
    .fullscreen:focus-visible { outline: 2px solid #cbe59e; outline-offset: 4px; }
    .fullscreen svg { width: 14px; height: 14px; flex: none; }
    body[data-embedded] .fullscreen { display: none; }
    .screen-note { margin: 6px 0 0; text-align: right; color: #e0dce6; font-size: 13px; }
    .showcase {
      width: min(1140px, calc(100% - 80px));
      margin: 0 auto;
      flex: 1;
      display: grid;
      align-content: center;
      gap: clamp(25px, 5vw, 51px);
      padding: 25px 0 clamp(35px, 7vw, 100px);
    }
    .intro { text-align: center; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 16px;
      padding: 6px 12px;
      border: 1px solid #3c4637;
      border-radius: 999px;
      background: #192119;
      color: #d2e6bd;
      font-size: 13px;
      font-weight: 650;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b9d894;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 5.6vw, 76px);
      line-height: 1.14;
      letter-spacing: -.06em;
      font-weight: 800;
      word-break: keep-all;
    }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .teaser {
      --accent: 165 199 135;
      --delay: 0s;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #333039;
      border-radius: 24px;
      background: #111015;
      box-shadow: 0 18px 40px #0005;
    }
    .teaser[data-theme="dress"] { --accent: 186 154 226; --delay: -.75s; }
    .teaser[data-theme="grow"] { --accent: 216 179 122; --delay: -1.5s; }
    .stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 1.25;
      background:
        radial-gradient(ellipse at 50% 57%, rgb(var(--accent) / .145), transparent 65%),
        linear-gradient(165deg, #19171f, #101016 73%);
    }
    .stage::before {
      content: "";
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: 11%;
      height: 14%;
      border: 1px solid rgb(var(--accent) / .19);
      border-radius: 50%;
      background: rgb(var(--accent) / .025);
    }
    .stage::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 13%;
      height: 10%;
      border: 1px solid rgb(var(--accent) / .095);
      border-radius: 50%;
    }
    .art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }
    .shape {
      fill: #07070a;
      stroke: rgb(var(--accent) / .64);
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 5px 15px rgb(var(--accent) / .13));
    }
    .spark {
      fill: none;
      stroke: rgb(var(--accent) / .54);
      stroke-width: 1.1;
      stroke-linecap: round;
    }
    .spark-dot { fill: rgb(var(--accent) / .58); }
    .mystery {
      position: absolute;
      z-index: 2;
      top: 53%;
      left: 50%;
      color: #faf7fc;
      font-size: clamp(53px, 6.8vw, 92px);
      line-height: .92;
      font-weight: 750;
      text-shadow: 0 0 25px rgb(var(--accent) / .4);
      transform: translate(-50%, -50%);
      animation: float 4.6s ease-in-out var(--delay) infinite;
    }
    @keyframes float {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 4px)); }
    }
    .teaser h2 {
      margin: 0;
      padding: 19px 14px 21px;
      border-top: 1px solid #2b2833;
      text-align: center;
      font-size: clamp(16px, 1.7vw, 21px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -.035em;
      word-break: keep-all;
    }
    @media (min-width: 741px) and (max-height: 730px) {
      .showcase { gap: 28px; padding: 18px 0 30px; }
      .stage { aspect-ratio: 1.45; }
    }
    @media (max-width: 740px) {
      .masthead { width: calc(100% - 42px); padding-top: 18px; }
      .showcase { width: min(460px, calc(100% - 42px)); gap: 24px; padding: 20px 0 36px; }
      .gallery { grid-template-columns: 1fr; gap: 12px; }
      .stage { aspect-ratio: 1.66; }
      .mystery { font-size: clamp(57px, 13vw, 72px); }
      .teaser h2 { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mystery { animation: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <span class="wordmark" aria-label="AutoPets">AutoPets<span aria-hidden="true">.</span></span>
    <div>
      <button class="fullscreen" type="button" aria-pressed="false" hidden>
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round">
          <path d="M6 2.5H2.5V6m7.5-3.5h3.5V6m0 4v3.5H10m-7.5-3.5v3.5H6"/>
        </svg>
        <span>전체 화면</span>
      </button>
      <p class="screen-note" role="status" hidden>브라우저에서 F11을 눌러 주세요.</p>
    </div>
  </header>
  <main class="showcase">
    <div class="intro">
      <p class="status">준비 중</p>
      <h1>펫의 다음 모습<span aria-hidden="true">.</span></h1>
    </div>
    <section class="gallery" aria-label="다음 펫 예고">
      <article class="teaser" data-theme="new" aria-labelledby="new-pet">
        <div class="stage" aria-hidden="true">
          <svg class="art" viewBox="0 0 320 236" focusable="false">
            <path class="spark" d="M66 52v10m-5-5h10m199 65v8m-4-4h8"/>
            <circle class="spark-dot" cx="253" cy="48" r="1.5"/>
            <circle class="spark-dot" cx="45" cy="146" r="1.2"/>
            <path class="shape" d="M93 110C70 107 55 89 64 69c7-16 30-18 46-3 13-11 29-16 49-16 22 0 39 6 53 19 16-15 37-15 46 0 11 20-5 44-30 49 3 13-1 25-10 34 5 11 11 20 25 21 13 1 17-13 27-9 14 5 1 28-14 34-15 6-32 3-47-5-12 10-29 12-47 8-15 5-36 3-49-4-18 2-32-5-32-18 0-12 10-27 24-36-9-8-14-21-12-33Z"/>
          </svg>
          <span class="mystery">?</span>
        </div>
        <h2 id="new-pet">펫 추가</h2>
      </article>
      <article class="teaser" data-theme="dress" aria-labelledby="dress-pet">
        <div class="stage" aria-hidden="true">
          <svg class="art" viewBox="0 0 320 236" focusable="false">
            <path class="spark" d="M240 52v11m-5.5-5.5h11M63 137v8m-4-4h8"/>
            <circle class="spark-dot" cx="270" cy="104" r="1.4"/>
            <circle class="spark-dot" cx="78" cy="48" r="1.2"/>
            <path class="shape" d="M94 104c-14 1-32-4-36-12-4-8 8-13 27-14l9-24c3-10 11-14 21-12l38 10c11 3 17 12 15 23l-2 9c11 0 21 3 30 9 15-8 31-7 42 3 15 14 12 36-5 47l19 10c6 3 8 10 3 15l-10 10 5 17c3 10-5 14-12 9l-24-16c-15 13-33 17-55 13-17 5-34 3-48-5-17 2-31-4-32-16-2-13 9-29 21-39-7-11-9-24-6-37Z"/>
          </svg>
          <span class="mystery">?</span>
        </div>
        <h2 id="dress-pet">펫 꾸미기</h2>
      </article>
      <article class="teaser" data-theme="grow" aria-labelledby="grow-pet">
        <div class="stage" aria-hidden="true">
          <svg class="art" viewBox="0 0 320 236" focusable="false">
            <path class="spark" d="M46 86v10m-5-5h10m228-37v12m-6-6h12"/>
            <circle class="spark-dot" cx="55" cy="154" r="1.5"/>
            <circle class="spark-dot" cx="258" cy="32" r="1.2"/>
            <path class="shape" d="M86 131c-10-15-13-34-10-54 2-12 5-31 12-33 7-3 16 14 23 29 9-5 19-9 31-10 0-14 5-28 12-29 8-2 14 13 17 27 13 1 26 5 36 12 9-17 22-33 30-30 8 3 10 20 10 34 1 20-5 36-14 50 0 14 8 25 19 28 14 4 25-6 28-19 10 13 8 32-2 44-12 14-33 17-50 11-13 11-29 15-51 11-18 6-38 5-54-3-18 3-35-4-40-17-5-16 2-33 14-47l-11-4Z"/>
          </svg>
          <span class="mystery">?</span>
        </div>
        <h2 id="grow-pet">펫 진화</h2>
      </article>
    </section>
  </main>
  <script>
    const fullscreen = document.querySelector('.fullscreen');
    const label = fullscreen.querySelector('span');
    const screenNote = document.querySelector('.screen-note');

    if (document.fullscreenEnabled && !document.body.hasAttribute('data-embedded')) {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', async () => {
        screenNote.hidden = true;
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          screenNote.hidden = false;
        }
      });
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        fullscreen.setAttribute('aria-pressed', String(active));
        label.textContent = active ? '전체 화면 종료' : '전체 화면';
      });
    }
  </script>
</body>
</html>
