const modeLabels={research:'자료 조사 중',writing:'초안 작성 중',tool:'Notion 사용 중',waiting:'확인이 필요해요',done:'응답이 도착했어요',failed:'작업 오류',unknown:'연결을 확인해 주세요'};
function announce(s){$('#announcer').textContent=s;}
function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);announce(s);setTimeout(()=>t.remove(),2800);}
function sprite(mode='idle'){return `<span class="sprite ${['research','writing','tool'].includes(mode)?mode:'idle'}" aria-hidden="true"></span>`;}
function chrome(name){return `<div class="chrome"><i></i><i></i><i></i><span>${name}</span></div>`;}
function desktopBase(body){return `<div class="desktop"><div class="systembar"><span><b>내 작업 공간</b>${screen==='codex'||stage===1?'Codex':'Notion · 회의 준비'}</span><span>09:41 &nbsp; ◉</span></div>${body}<div class="taskbar" aria-hidden="true"><span class="appico folder">▰</span><span class="appico browser">●</span><span class="appico notion">N</span><span class="appico codex">✳</span><span class="appico">a</span></div></div>`;}
function documentWindow(){return `<div class="window behind"></div><div class="window">${chrome('Notion · 다음 주 캠페인 킥오프')}<div class="document"><aside class="docnav"><div class="workspace">N &nbsp; 나의 워크스페이스</div><div class="navitem">⌕ &nbsp; 검색</div><div class="navitem">◷ &nbsp; 최근 페이지</div><div class="navitem selected">▤ &nbsp; 회의 준비</div><div class="navitem">▧ &nbsp; 이번 주 업무</div></aside><article class="docbody"><div class="crumb">워크스페이스 / 마케팅 / 회의 준비</div><div class="docicon">▦</div><h2>다음 주 캠페인 킥오프</h2><div class="desc">팀과 함께 이야기할 내용을 정리해 둡니다.</div><h3>오늘 정할 것</h3><div class="checkline"><i></i>캠페인 목표와 핵심 고객</div><div class="checkline"><i></i>담당자별 다음 액션</div><div class="checkline"><i></i>첫 실험의 일정과 범위<span class="cursor"></span></div><div class="callout">↳ 경쟁사 비교 자료는 Codex에 맡겨 두었어요.</div><h3>아이디어 메모</h3><div class="doclines"><div></div><div></div><div></div></div></article></div></div><div class="deskcaption"><strong>지금 나는 회의를 준비하는 중</strong><br>Codex에 맡긴 두 작업은<br>화면 한쪽에서 따로 확인할 수 있어요.</div>`;}
function pet(t){const badge=t.alert?'◷':({tool:'N',waiting:'?',done:'✓',failed:'!',unknown:'…'}[t.mode]||'');const badgeClass=t.alert?'warn':({done:'ok',failed:'error',unknown:'muted'}[t.mode]||'');return `<button class="petbutton" data-pet="${t.id}" aria-label="${esc(t.name)} 펫, ${esc(t.alert?'시간 알림':modeLabels[t.mode])}" aria-expanded="${selected===t.id&&screen==='desktop'}">${t.alert?'<span class="bubble">◷ '+t.elapsed+'분 지났어요</span>':''}${sprite(t.mode)}${badge?`<span class="petbadge ${badgeClass}">${badge}</span>`:''}<span class="petlabel"><strong>${esc(t.name)}</strong><span>${esc(modeLabels[t.mode])}</span></span></button>`;}
function currentIndex(t){return t.mode==='research'?0:['writing','tool'].includes(t.mode)?1:t.mode==='done'?3:1;}
function detail(t){const idx=currentIndex(t);const status=t.mode==='unknown'?'최근 연결 상태를 확인할 수 없어요':t.mode==='failed'?'작업에서 오류가 보고됐어요':modeLabels[t.mode];return `<aside class="detail" aria-label="${esc(t.name)} 단계 카드"><div class="detailhead"><div><strong>${esc(t.name)}</strong><small>${t.mode==='unknown'?'마지막으로 받은 상태':'방금 갱신 · 시연 데이터'}</small></div><button class="close" aria-label="단계 카드 닫기" data-close>×</button></div><div class="detailbody"><div class="goal"><b>완료 기준</b>${esc(t.goal)}</div><div class="current">${esc(status)}</div><ol class="plan">${t.steps.map((s,i)=>`<li class="${i<idx?'complete':i===idx?'active':''}"><i>${i<idx?'✓':i+1}</i>${esc(s)}</li>`).join('')}</ol><div class="timer"><span>관측 후 ${t.elapsed}분</span><span>${t.limit===null?'시간 알림 꺼짐':t.limit+'분 알림'}</span></div>${t.alert?`<div class="notice"><strong>◷ 정해 둔 확인 시간이 됐어요</strong>작업은 계속 진행 중이에요. 현재 단계를 보고 판단해 주세요.</div><div class="detailactions"><button data-ack>확인했어요</button><button data-snooze>5분 뒤 다시 알림</button></div>`:''}<button class="primary return" data-return>이 Codex 작업으로 돌아가기 ↗</button><button class="setting-toggle" data-settings aria-expanded="${settings}">시간·토큰 설정 ${settings?'접기':'보기'} ${settings?'−':'+'}</button>${settings?`<section class="settings" aria-label="알림 설정"><label>시간 알림 <input type="checkbox" id="timer-enabled" ${t.limit!==null?'checked':''}></label><label for="minutes">알림 기준 (분)<input type="number" id="minutes" min="1" max="1440" value="${t.limit||10}" ${t.limit===null?'disabled':''}></label><label>토큰 알림 <input type="checkbox" disabled aria-label="토큰 알림 — 측정 미연결"></label><p>작업별 토큰 사용량이 연결되면 켤 수 있어요.<br>현재는 측정 미연결 상태입니다.</p></section>`:''}</div></aside>`;}
function onboard(){return `<div class="window onboard">${chrome('Codex · 경쟁사 비교 초안')}<div class="chatbody"><div class="chattitle">Codex &nbsp; / &nbsp; 경쟁사 비교 초안</div><div class="userprompt"><b>$autopets</b> 경쟁사 3곳을 비교해서 초안을 만들어줘.<br>나는 그동안 회의를 준비할게.</div><p class="assistantline">좋아요. 시작 전에 두 가지만 정할게요.</p><form id="start-form"><div class="q"><label for="goal"><span class="qnum">01</span>어떤 결과가 나오면 완료인가요?</label><input id="goal" type="text" maxlength="240" required value="${esc(tasks[0].goal)}"></div><div class="q"><span class="qlegend"><span class="qnum">02</span>언제 확인받을까요?</span><div class="radios"><label><input type="radio" name="intervention" value="when-needed" ${tasks[0].criterion==='when-needed'?'checked':''}>막히거나 결정이 필요할 때</label><label><input type="radio" name="intervention" value="milestones" ${tasks[0].criterion==='milestones'?'checked':''}>주요 단계마다</label></div></div><div class="onboardfoot"><span class="small">◷ 기본 10분 알림 · 나중에 바꿀 수 있어요</span><button class="primary" type="submit">펫과 시작하기 →</button></div></form></div></div><div class="welcome-pet"><span class="welcome-tag">채팅에서 부르는 작은 동료</span>${sprite()}<p><b>준비되면 함께할게요.</b>지금 이 작업에 연결됩니다.</p></div>`;}
function codexWindow(t){const status=t.mode==='done'?'응답이 도착했습니다. 결과와 출처를 확인해 주세요.':t.mode==='failed'?'도구 실행 중 오류가 보고되었습니다. 오류 내용을 확인해 주세요.':t.mode==='unknown'?'연결 상태를 확인할 수 없습니다. 원래 작업 화면에서 상태를 확인해 주세요.':'공개 자료를 바탕으로 비교 초안을 작성하고 있습니다.';return `<div class="window codexwindow">${chrome('Codex · 복귀 화면 시연')}<div class="document"><aside class="codexside"><strong>✳ Codex</strong><div class="small" style="margin:22px 0 8px">내 작업</div>${tasks.map(x=>`<button class="tasklink ${x.id===t.id?'selected':''}" data-task="${x.id}">${esc(x.name)}</button>`).join('')}</aside><article class="codexbody"><div class="crumb">복귀 화면 시연 · 실제 Codex와 연결되지 않았어요</div><h2>${esc(t.name)}</h2><div class="userprompt" style="margin-left:0">${esc(t.goal)}</div><p class="assistantline">${esc(status)}</p><div class="response"><div class="label">현재 작업 단계</div>${esc(t.steps[Math.min(currentIndex(t),2)])}<br><span class="small">${t.criterion==='milestones'?'주요 단계가 끝나면 확인받기':'막히거나 결정이 필요할 때 확인받기'}</span></div><button class="backwork" data-back>← 회의 준비로 돌아가기</button><div class="inputmock">필요한 변경 사항을 이어서 알려주세요…</div></article></div></div>`;}
function render(){const c=copy[stage];$('#headline').innerHTML=poster?c.title:'맡긴 일은 한눈에.<br>확인할 순간은 놓치지 않게.';$('#lead').innerHTML=poster?c.lead:'다른 일을 하는 동안, 작은 펫이 Codex 작업의 진행과 확인할 순간을 알려줍니다.';$('#eyebrow').textContent=poster?c.eyebrow:'A LITTLE COMPANION FOR YOUR AI WORK';$('#takeaway').textContent=c.tip;$('#takeaway-sub').textContent=c.sub;$('#poster-num').textContent=`0${stage} / 03`;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',Number(b.dataset.scene)===stage));let content=stage===1?onboard():screen==='codex'?codexWindow(tasks.find(t=>t.id===selected)||tasks[0]):documentWindow();if(stage!==1){content+=`<div class="petdock">${tasks.map(pet).join('')}</div>`;if(selected&&screen==='desktop')content+=detail(tasks.find(t=>t.id===selected));}$('#scene').innerHTML=desktopBase(content);$('#guidance').innerHTML=stage===1?'완료 기준을 확인하고 <b>펫과 시작하기</b>를 눌러보세요.':screen==='codex'?'선택한 펫의 <b>같은 작업</b>으로 돌아왔어요.':stage===2?'<b>오른쪽 아래 펫을 눌러</b> 현재 단계를 살펴보세요.':'시간 알림이 왔어요. <b>경쟁사 비교 펫을 눌러</b> 확인해 보세요.';$('#state-example').disabled=stage===1;$('#advance').disabled=stage===1;if(stage===3&&screen==='desktop'&&!tasks[0].alert)$('#guidance').innerHTML='알림을 확인했어요. <b>작업은 계속 진행됩니다.</b>';bindScene();}
function bindScene(){document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.pet&&screen==='desktop'?null:b.dataset.pet;screen='desktop';settings=false;render();});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{selected=b.dataset.task;render();});$('[data-close]')?.addEventListener('click',()=>{selected=null;render();});$('[data-settings]')?.addEventListener('click',()=>{settings=!settings;render();});$('[data-return]')?.addEventListener('click',()=>{screen='codex';settings=false;render();announce('선택한 Codex 작업의 시연 화면으로 이동했습니다.');});$('[data-back]')?.addEventListener('click',()=>{screen='desktop';selected=null;render();});$('[data-ack]')?.addEventListener('click',()=>{const t=tasks.find(x=>x.id===selected);t.alert=false;render();toast('알림을 확인했어요. 작업은 계속 진행돼요.');});$('[data-snooze]')?.addEventListener('click',()=>{const t=tasks.find(x=>x.id===selected);t.alert=false;t.notified=false;t.threshold=t.elapsed+5;render();toast('5분 뒤 다시 알려드릴게요.');});$('#timer-enabled')?.addEventListener('change',e=>{const t=tasks.find(x=>x.id===selected);t.limit=e.target.checked?10:null;t.threshold=t.limit===null?null:t.elapsed+t.limit;t.alert=false;t.notified=false;render();});$('#minutes')?.addEventListener('change',e=>{const t=tasks.find(x=>x.id===selected);const v=Number(e.target.value);if(!Number.isInteger(v)||v<1||v>1440){e.target.value=t.limit;return;}t.limit=v;t.threshold=t.elapsed+v;t.alert=false;t.notified=false;render();toast('지금부터 '+v+'분 뒤 알려드릴게요.');});$('#start-form')?.addEventListener('submit',e=>{e.preventDefault();const g=$('#goal').value.trim();if(!g){$('#goal').focus();return;}tasks[0].goal=g;tasks[0].criterion=document.querySelector('[name=intervention]:checked').value;go(2);announce('경쟁사 비교 작업에 펫이 연결되었습니다. 시연 데이터입니다.');});}
function go(n){stage=n;selected=null;screen='desktop';settings=false;if(n===3){tasks[0].mode='writing';tasks[0].elapsed=10;tasks[0].alert=true;tasks[0].notified=true;tasks[0].threshold=10;}render();}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>go(Number(b.dataset.scene)));$('#reset').onclick=()=>{tasks=structuredClone(fixture);$('#state-example').value='research';go(1);};$('#advance').onclick=()=>{for(const t of tasks){if(['done','failed','unknown','waiting'].includes(t.mode))continue;t.elapsed++;if(t.threshold!==null&&!t.notified&&t.elapsed>=t.threshold){t.alert=true;t.notified=true;announce(t.name+' 작업의 확인 시간이 됐어요.');}}render();};$('#state-example').onchange=e=>{const t=tasks.find(x=>x.id===selected)||tasks[0];t.mode=e.target.value;if(['done','failed','unknown','waiting'].includes(t.mode))t.alert=false;screen='desktop';selected=t.id;render();};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render();}});
go(poster||1);if(poster===3){selected=tasks[0].id;render();}
</script></body></html>
