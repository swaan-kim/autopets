name: Pull request collaboration format

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: PR summary and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the format validator
        run: node --test scripts/tests/pull-request.test.mjs
      - name: Check the PR body as data
        # Never interpolate PR text into shell commands or use pull_request_target.
        run: node scripts/check-pull-request.mjs --event "$GITHUB_EVENT_PATH"
